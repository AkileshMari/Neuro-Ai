<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Neuro AI | Machines</title><style>
:root{
  --bg:#0a0f14;--panel:#111820;--panel2:#151e28;--line:#263340;
  --text:#edf4f8;--muted:#8fa0ae;--cyan:#21d4fd;--blue:#3b82f6;
  --green:#31d48a;--yellow:#f6c945;--red:#ff5d6c;--shadow:0 18px 50px rgba(0,0,0,.28)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
a{text-decoration:none;color:inherit}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#0c131a;border-right:1px solid var(--line);padding:22px 15px;position:fixed;inset:0 auto 0 0;z-index:10}
.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 28px}.logo-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#20d4fd,#2563eb);font-weight:900;color:#fff;box-shadow:0 8px 25px rgba(33,212,253,.18)}
.brand h1{font-size:16px;margin:0}.brand p{font-size:10px;color:var(--muted);margin:3px 0}.nav-title{font-size:10px;color:#607181;padding:12px 11px 7px;letter-spacing:1.2px}.nav a{display:flex;gap:12px;align-items:center;padding:12px 12px;margin:4px 0;border-radius:9px;color:#9aa9b6;font-size:13px}.nav a:hover,.nav a.active{background:#17232e;color:#fff}.nav a.active{box-shadow:inset 3px 0 var(--cyan)}.nav-icon{width:20px;text-align:center}.side-bottom{position:absolute;bottom:18px;left:15px;right:15px;border-top:1px solid var(--line);padding-top:14px}.user-mini{display:flex;gap:9px;align-items:center;padding:8px}.avatar{width:31px;height:31px;border-radius:50%;background:#243444;display:grid;place-items:center;font-size:11px;color:#9eeeff}
.main{margin-left:245px;width:calc(100% - 245px);padding:22px 28px 35px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.page-title h2{margin:0;font-size:25px}.page-title p{margin:5px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px;align-items:center}.icon-btn,.ghost-btn{background:#121b23;border:1px solid var(--line);color:#b9c6cf;border-radius:8px;padding:9px 12px;cursor:pointer}.status-live{display:flex;gap:7px;align-items:center;color:#8eeec1;font-size:11px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(49,212,138,.09)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.card{background:linear-gradient(145deg,var(--panel),#0e151d);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.kpi{padding:17px}.kpi-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.kpi-value{font-size:28px;font-weight:700;margin:13px 0 5px}.trend{font-size:10px}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:1.55fr .85fr;gap:17px}.card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 17px;border-bottom:1px solid var(--line)}.card-head h3{font-size:14px;margin:0}.card-head span{font-size:10px;color:var(--muted)}.chart-wrap{height:280px;padding:15px}.donut-wrap{height:280px;padding:22px;position:relative}.donut-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);text-align:center;pointer-events:none}.donut-center b{display:block;font-size:28px}.donut-center span{font-size:10px;color:var(--muted)}
.bottom-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:17px;margin-top:17px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #202b35;text-align:left;white-space:nowrap}.table th{font-size:9px;color:#6f8190;text-transform:uppercase;letter-spacing:.7px}.machine-name{font-weight:600}.sub{font-size:9px;color:var(--muted);margin-top:3px}.badge{padding:4px 7px;border-radius:20px;font-size:9px;font-weight:700}.badge.healthy{background:rgba(49,212,138,.12);color:#70e7ad}.badge.warning{background:rgba(246,201,69,.12);color:#f8d765}.badge.critical{background:rgba(255,93,108,.12);color:#ff7f8b}.alert-list{padding:5px 17px 10px}.alert{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #202b35}.alert:last-child{border:0}.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px}.alert-dot.warning{background:var(--yellow);box-shadow:0 0 10px rgba(246,201,69,.4)}.alert-dot.critical{background:var(--red);box-shadow:0 0 10px rgba(255,93,108,.45)}.alert strong{font-size:11px}.alert small{display:block;color:var(--muted);margin-top:4px;font-size:9px}.section{margin-bottom:17px}.machine-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.machine-card{padding:16px}.machine-top{display:flex;justify-content:space-between;align-items:flex-start}.machine-id{font-size:10px;color:var(--muted)}.machine-card h3{margin:4px 0;font-size:15px}.machine-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.metric{background:#0d151c;border:1px solid #1f2b36;border-radius:8px;padding:10px}.metric span{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:4px;font-size:14px}.mini-bar{height:4px;background:#1e2a34;border-radius:5px;overflow:hidden;margin-top:7px}.mini-bar i{display:block;height:100%;border-radius:5px;background:var(--cyan)}.view-btn{width:100%;padding:9px;background:#18232d;border:1px solid #2a3946;border-radius:7px;color:#c9d4dc;cursor:pointer}.view-btn:hover{border-color:#3b6378}
.detail-grid{display:grid;grid-template-columns:1.55fr .75fr;gap:17px}.detail-chart{height:360px;padding:16px}.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}.spec{background:#0d151c;border:1px solid #202d38;border-radius:8px;padding:11px}.spec span{display:block;font-size:9px;color:var(--muted)}.spec b{display:block;font-size:13px;margin-top:5px}.detail-actions{display:flex;gap:8px}.primary-btn{border:0;background:linear-gradient(135deg,#1ac9ef,#2563eb);color:#fff;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:700}.danger-btn{border:1px solid rgba(255,93,108,.3);background:rgba(255,93,108,.08);color:#ff8993;border-radius:8px;padding:10px 13px;cursor:pointer}
.upload{border:1px dashed #385061;padding:35px;text-align:center;border-radius:12px;background:#0d151c}.upload.drag{border-color:var(--cyan);background:#0f1d25}.upload h3{margin:7px 0}.upload p{font-size:11px;color:var(--muted)}.file-input{display:none}.file-list{margin-top:15px}.file-item{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #202b35;font-size:11px}.filter-row{display:flex;gap:9px;margin-bottom:14px}.filter-row input,.filter-row select{background:#111a22;color:#dce5eb;border:1px solid var(--line);padding:9px;border-radius:7px;outline:none}
.login-page{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 25%,#123044 0,#0a0f14 38%)}.login-shell{width:min(420px,92vw)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.login-brand h1{margin:0;font-size:21px}.login-brand p{margin:4px 0;color:var(--muted);font-size:11px}.login-card{background:rgba(17,24,32,.94);border:1px solid var(--line);border-radius:14px;padding:27px;box-shadow:var(--shadow)}.eyebrow{font-size:9px;color:var(--cyan);letter-spacing:1.5px}.login-card h2{margin:7px 0;font-size:25px}.muted{color:var(--muted);font-size:11px}.login-card form{margin-top:24px}.login-card label{display:block;font-size:10px;color:#9eacb8;margin-bottom:14px}.login-card input:not([type=checkbox]){width:100%;margin-top:7px;padding:12px;background:#0c141b;border:1px solid #263541;color:#fff;border-radius:8px;outline:none}.login-card input:focus{border-color:#3b7187}.login-row{display:flex!important;justify-content:space-between;align-items:center}.check{display:flex!important;gap:6px;align-items:center}.demo-hint{font-size:9px;color:#647785}.login-card .primary-btn{width:100%;display:flex;justify-content:space-between}.login-footer{text-align:center;color:#556775;font-size:9px;margin-top:18px}

.brand-logo-img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
.login-logo{width:64px;height:64px;border-radius:10px}

@media(max-width:1050px){.kpi-grid{grid-template-columns:1fr 1fr}.dashboard-grid,.bottom-grid,.detail-grid{grid-template-columns:1fr}.machine-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.sidebar{width:62px;padding:12px 8px}.brand div:not(.logo-mark),.nav-title,.nav a span:not(.nav-icon),.side-bottom .user-mini div{display:none}.brand{padding:5px 3px 25px}.nav a{justify-content:center;padding:12px}.main{margin-left:62px;width:calc(100% - 62px);padding:17px 12px}.machine-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start}.status-live{display:none}}

const STORE="industrialMachinesV1";
const ALERTS="industrialAlertsV1";

function seededMachines(){
  const names=["CNC Milling Unit","Hydraulic Press","Robotic Welder","CNC Lathe","Injection Molder","Conveyor Drive","Air Compressor","Laser Cutter","Industrial Pump","Heat Treatment Oven","Assembly Robot","Packaging Unit"];
  const types=["CNC","Press","Robot","CNC","Molding","Conveyor","Compressor","Laser","Pump","Oven","Robot","Packaging"];
  return names.map((name,i)=>{
    const status=i===2||i===8?"critical":i===4||i===10?"warning":"healthy";
    const base=72+(i*7)%20;
    const temp=54+(i*5)%27;
    const vibration=1.1+(i%6)*.38;
    const efficiency=Math.max(61,Math.min(97,base-(status==="critical"?17:status==="warning"?8:0)));
    return {id:`UNIT-${String(i+1).padStart(2,"0")}`,name,type:types[i],status,efficiency,temp:+temp.toFixed(1),vibration:+vibration.toFixed(2),rpm:900+i*125,production:760+i*47,maintenance:`2026-10-${String(8+(i%18)).padStart(2,"0")}`,updated:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), history:Array.from({length:12},(_,j)=>Math.max(50,Math.min(99,Math.round(efficiency+(Math.random()*12-6)-(j===11?0:0)))))};
  });
}
function getMachines(){let x=localStorage.getItem(STORE);if(!x){x=seededMachines();localStorage.setItem(STORE,JSON.stringify(x))}return JSON.parse(x)}
function saveMachines(x){localStorage.setItem(STORE,JSON.stringify(x))}
function getAlerts(){let x=localStorage.getItem(ALERTS);if(!x){x=[{id:1,unit:"UNIT-03",level:"critical",title:"High motor temperature",detail:"Temperature crossed 88°C threshold",time:"2 min ago"},{id:2,unit:"UNIT-05",level:"warning",title:"Vibration rising",detail:"Vibration trend increased for 3 cycles",time:"8 min ago"},{id:3,unit:"UNIT-09",level:"critical",title:"Pump pressure drop",detail:"Pressure below safe operating band",time:"14 min ago"},{id:4,unit:"UNIT-11",level:"warning",title:"Efficiency declining",detail:"OEE dropped below 75%",time:"21 min ago"}];localStorage.setItem(ALERTS,JSON.stringify(x))}return JSON.parse(x)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function navActive(){const page=location.pathname.split("/").pop()||"dashboard.html";document.querySelectorAll(".nav a").forEach(a=>{a.classList.toggle("active",a.getAttribute("href")===page)})}
function logout(){localStorage.removeItem("industrialLoggedIn");location.href="login.html"}
function ensureLogin(){if(localStorage.getItem("industrialLoggedIn")!=="true" && !location.pathname.endsWith("login.html"))location.href="login.html"}

function topbar(title,sub){document.getElementById("topbar").innerHTML=`<div class="page-title"><h2>${title}</h2><p>${sub}</p></div><div class="top-actions"><div class="status-live"><i class="pulse"></i> LIVE MONITORING</div><button class="icon-btn" onclick="location.reload()">↻</button></div>`}
function badge(s){return `<span class="badge ${s}">${s.toUpperCase()}</span>`}
function randomize(){
 const m=getMachines().map(x=>{
   const drift=(Math.random()*8-4);x.efficiency=Math.max(50,Math.min(99,Math.round(x.efficiency+drift)));
   x.temp=+(x.temp+(Math.random()*4-2)).toFixed(1);x.vibration=+Math.max(.4,x.vibration+(Math.random()*.4-.2)).toFixed(2);
   x.updated=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
   x.history=[...x.history.slice(1),x.efficiency];
   if(x.temp>88||x.vibration>3.5)x.status="critical";else if(x.temp>78||x.vibration>2.7||x.efficiency<75)x.status="warning";else x.status="healthy";
   return x;
 });saveMachines(m);return m;
}
function loadChart(src,type="line",labels=null){
 const canvas=document.getElementById("mainChart");if(!canvas)return;
 if(window.__chart)window.__chart.destroy();
 window.__chart=new Chart(canvas,{type,data:{labels:labels||["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","Now"],datasets:[{label:"Efficiency %",data:src,borderWidth:2,tension:.35,fill:true,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:"#1c2730"},ticks:{color:"#728391",font:{size:9}}},y:{min:40,max:100,grid:{color:"#1c2730"},ticks:{color:"#728391",font:{size:9}}}}}});
}

 document.getElementById("content").innerHTML=`
 <div class="kpi-grid">
  <div class="card kpi"><div class="kpi-head">TOTAL MACHINES <span>●</span></div><div class="kpi-value">${m.length}</div><div class="trend neutral">12 units monitored</div></div>
  <div class="card kpi"><div class="kpi-head">OVERALL OEE <span>◒</span></div><div class="kpi-value">${Math.round(m.reduce((s,x)=>s+x.efficiency,0)/m.length)}%</div><div class="trend up">↑ Live calculated</div></div>
  <div class="card kpi"><div class="kpi-head">ACTIVE ALERTS <span>!</span></div><div class="kpi-value">${a.length}</div><div class="trend ${c?"down":"up"}">${c} critical · ${w} warning</div></div>
  <div class="card kpi"><div class="kpi-head">NEXT MAINTENANCE <span>◷</span></div><div class="kpi-value">3 days</div><div class="trend neutral">UNIT-01 scheduled</div></div>
 </div>
 <div class="dashboard-grid">
  <div class="card"><div class="card-head"><h3>Plant Performance</h3><span>Last 6 hours · average OEE</span></div><div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>
  <div class="card"><div class="card-head"><h3>Machine Health</h3><span>12 units</span></div><div class="donut-wrap"><canvas id="healthChart"></canvas><div class="donut-center"><b>${m.length}</b><span>UNITS</span></div></div></div>
 </div>
 <div class="bottom-grid">
  <div class="card"><div class="card-head"><h3>Machine Status</h3><a href="machines.html" style="font-size:10px;color:#5fdcff">View all →</a></div><div class="table-wrap"><table class="table"><thead><tr><th>Unit</th><th>Efficiency</th><th>Temp</th><th>Vibration</th><th>Status</th></tr></thead><tbody>${m.map(x=>`<tr><td><a class="machine-name" href="machine.html?id=${x.id}">${esc(x.name)}</a><div class="sub">${x.id}</div></td><td>${x.efficiency}%</td><td>${x.temp}°C</td><td>${x.vibration} mm/s</td><td>${badge(x.status)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><div class="card-head"><h3>Live Alerts</h3><a href="alerts.html" style="font-size:10px;color:#5fdcff">View all →</a></div><div class="alert-list">${a.slice(0,5).map(x=>`<div class="alert"><i class="alert-dot ${x.level}"></i><div><strong>${esc(x.title)} · ${x.unit}</strong><small>${esc(x.detail)} · ${x.time}</small></div></div>`).join("")}</div></div>
 </div>`;
 loadChart(Array.from({length:12},(_,i)=>Math.round(78+Math.sin(i/1.5)*5+(Math.random()*5-2.5))));
 new Chart(document.getElementById("healthChart"),{type:"doughnut",data:{labels:["Healthy","Warning","Critical"],datasets:[{data:[healthy,w,c],borderWidth:0}]},options:{cutout:"72%",plugins:{legend:{position:"bottom",labels:{color:"#a7b4be",font:{size:10},boxWidth:9,padding:13}}}}});
}
function machines(){
 const m=getMachines();topbar("Machines","All monitored equipment and current operating conditions");
 document.getElementById("content").innerHTML=`<div class="filter-row"><input id="machineSearch" placeholder="Search machine or unit ID..." oninput="renderMachines()"><select id="statusFilter" onchange="renderMachines()"><option value="all">All statuses</option><option value="healthy">Healthy</option><option value="warning">Warning</option><option value="critical">Critical</option></select><button class="primary-btn" onclick="randomize();renderMachines()">↻ Refresh demo data</button></div><div id="machineGrid" class="machine-grid"></div>`;
 renderMachines();
}
function renderMachines(){
 const q=(document.getElementById("machineSearch")?.value||"").toLowerCase(),f=document.getElementById("statusFilter")?.value||"all";
 const m=getMachines().filter(x=>(f==="all"||x.status===f)&&(x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)));
 document.getElementById("machineGrid").innerHTML=m.map(x=>`<div class="card machine-card"><div class="machine-top"><div><div class="machine-id">${x.id} · ${x.type}</div><h3>${esc(x.name)}</h3></div>${badge(x.status)}</div><div class="machine-metrics"><div class="metric"><span>Efficiency</span><b>${x.efficiency}%</b><div class="mini-bar"><i style="width:${x.efficiency}%"></i></div></div><div class="metric"><span>Temperature</span><b>${x.temp}°C</b></div><div class="metric"><span>Vibration</span><b>${x.vibration} mm/s</b></div><div class="metric"><span>Production</span><b>${x.production}/hr</b></div></div><div class="sub" style="margin-bottom:10px">Last update: ${x.updated}</div><button class="view-btn" onclick="location.href='machine.html?id=${x.id}'">Open machine details →</button></div>`).join("");
}
function machineDetail(){
 const id=new URLSearchParams(location.search).get("id")||"UNIT-01",m=getMachines().find(x=>x.id===id)||getMachines()[0];
 topbar(`${m.name}`,`${m.id} · ${m.type} · detailed operating view`);
 document.getElementById("content").innerHTML=`<div class="detail-actions" style="margin-bottom:14px"><button class="ghost-btn" onclick="location.href='machines.html'">← All Machines</button><button class="primary-btn" onclick="refreshOne('${m.id}')">Refresh live data</button></div>
 <div class="detail-grid"><div class="card"><div class="card-head"><h3>Performance over time</h3><span>12 latest readings</span></div><div class="detail-chart"><canvas id="mainChart"></canvas></div></div>
 <div class="card"><div class="card-head"><h3>Machine Details</h3>${badge(m.status)}</div><div class="spec-grid">
 <div class="spec"><span>Efficiency</span><b>${m.efficiency}%</b></div><div class="spec"><span>Temperature</span><b>${m.temp}°C</b></div><div class="spec"><span>Vibration</span><b>${m.vibration} mm/s</b></div><div class="spec"><span>RPM</span><b>${m.rpm}</b></div><div class="spec"><span>Production</span><b>${m.production}/hr</b></div><div class="spec"><span>Next service</span><b>${m.maintenance}</b></div><div class="spec"><span>Operating hours</span><b>${(380+iHash(m.id)).toLocaleString()} h</b></div><div class="spec"><span>Last update</span><b>${m.updated}</b></div></div></div></div>
 <div class="card" style="margin-top:17px"><div class="card-head"><h3>AI Maintenance Assessment</h3><span>Frontend rule-based demo</span></div><div style="padding:17px;font-size:11px;line-height:1.8">${m.status==="critical"?`<b style="color:var(--red)">Critical action:</b> Stop or inspect the unit immediately. Temperature/vibration indicators suggest a serious developing fault.`:m.status==="warning"?`<b style="color:var(--yellow)">Early warning:</b> Schedule inspection soon. The machine is showing a developing performance deviation.`:`<b style="color:var(--green)">Normal:</b> Current operating indicators are within the configured demo thresholds.`}</div></div>`;
 loadChart(m.history);
}
function iHash(s){return [...s].reduce((a,c)=>a+c.charCodeAt(0),0)%700}
function refreshOne(id){randomize();location.reload()}
function alerts(){
 const a=getAlerts();topbar("Alerts & Warnings","Early-warning and serious-fault events detected from machine indicators");
 document.getElementById("content").innerHTML=`<div class="kpi-grid"><div class="card kpi"><div class="kpi-head">CRITICAL</div><div class="kpi-value" style="color:var(--red)">${a.filter(x=>x.level==="critical").length}</div><div class="trend down">Immediate attention</div></div><div class="card kpi"><div class="kpi-head">WARNING</div><div class="kpi-value" style="color:var(--yellow)">${a.filter(x=>x.level==="warning").length}</div><div class="trend neutral">Early intervention</div></div><div class="card kpi"><div class="kpi-head">TOTAL EVENTS</div><div class="kpi-value">${a.length}</div><div class="trend neutral">Current queue</div></div><div class="card kpi"><div class="kpi-head">RESPONSE MODE</div><div class="kpi-value" style="font-size:20px">LIVE</div><div class="trend up">Auto monitoring</div></div></div><div class="card"><div class="card-head"><h3>Alert Queue</h3><span>Newest first</span></div><div class="alert-list">${a.map(x=>`<div class="alert" style="padding:18px 0"><i class="alert-dot ${x.level}"></i><div style="flex:1"><strong>${esc(x.title)} · ${x.unit}</strong><small>${esc(x.detail)}</small></div>${badge(x.level)}<small style="margin-left:8px">${x.time}</small></div>`).join("")}</div></div>`;
}
function performance(){
 const m=getMachines();topbar("Performance Analytics","Compare unit efficiency and time-based machine performance");
 document.getElementById("content").innerHTML=`<div class="card"><div class="card-head"><h3>Unit Efficiency Comparison</h3><span>Current demo readings</span></div><div class="chart-wrap" style="height:420px"><canvas id="mainChart"></canvas></div></div><div class="card" style="margin-top:17px"><div class="card-head"><h3>Performance Table</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Unit</th><th>Efficiency</th><th>Temperature</th><th>Vibration</th><th>Output/hr</th><th>Status</th></tr></thead><tbody>${m.map(x=>`<tr><td>${x.id} · ${x.name}</td><td>${x.efficiency}%</td><td>${x.temp}°C</td><td>${x.vibration} mm/s</td><td>${x.production}</td><td>${badge(x.status)}</td></tr>`).join("")}</tbody></table></div></div>`;
 const canvas=document.getElementById("mainChart");new Chart(canvas,{type:"bar",data:{labels:m.map(x=>x.id),datasets:[{label:"Efficiency %",data:m.map(x=>x.efficiency),borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:"#82919c",font:{size:9}}},y:{min:40,max:100,ticks:{color:"#82919c"}}}}});
}
function upload(){
 topbar("Upload Data","Import CSV, JSON or Excel equipment/sensor logs directly in the browser");
 document.getElementById("content").innerHTML=`<div class="card"><div class="card-head"><h3>Equipment Data Import</h3><span>Frontend-only processing</span></div><div style="padding:17px"><div id="drop" class="upload"><div style="font-size:30px">⇧</div><h3>Drop data files here</h3><p>Supported: CSV, JSON, XLSX, XLS</p><button class="primary-btn" onclick="document.getElementById('file').click()">Choose files</button><input id="file" class="file-input" type="file" multiple accept=".csv,.json,.xlsx,.xls"></div><div id="fileList" class="file-list"></div><div style="margin-top:14px"><button class="ghost-btn" onclick="useSample()">Use 12-unit sample data</button> <button class="danger-btn" onclick="clearDemo()">Reset demo data</button></div></div></div>`;
 const drop=document.getElementById("drop"),input=document.getElementById("file");
 input.onchange=()=>handleFiles([...input.files]);["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));
}
function handleFiles(list){const box=document.getElementById("fileList");box.innerHTML=list.map(f=>`<div class="file-item"><span>▣ ${esc(f.name)}</span><span>${(f.size/1024).toFixed(1)} KB · <b style="color:var(--green)">Loaded locally</b></span></div>`).join("");list.forEach(f=>{if(f.name.endsWith(".json")){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){const m=getMachines();d.slice(0,12).forEach((row,i)=>{if(m[i])Object.assign(m[i],row)});saveMachines(m)}}catch(e){}};r.readAsText(f)}})}
function useSample(){localStorage.removeItem(STORE);localStorage.removeItem(ALERTS);location.reload()}
function clearDemo(){if(confirm("Reset all local demo data?")){localStorage.clear();location.href="login.html"}}
function init(){
 ensureLogin();sidebar();
 const p=location.pathname.split("/").pop();
 if(p==="dashboard.html"||p==="")dashboard();else if(p==="machines.html")machines();else if(p==="machine.html")machineDetail();else if(p==="alerts.html")alerts();else if(p==="performance.html")performance();else if(p==="upload.html")upload();
}

</script><script>init();</script></body></html>
